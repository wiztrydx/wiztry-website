name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 既定は読み取りだけ。Pagesへの書き込み権限は deploy ジョブにだけ渡す（build で動く外部アクションや npm に渡さない）。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # sitemapのlastmodを各ページのGit更新履歴から正確に生成するため、履歴を取得する。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
      # lockfileどおりに入れ、依存スクリプトの実行と既知の脆弱性を含む公開を防ぐ。
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm audit --audit-level=moderate
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # 公開直後にBing系（=ChatGPTの検索グラウンディング元）へ更新を通知する。
      # 失敗してもデプロイ自体は成功扱いにしたいので continue-on-error にしている。
      - name: Notify IndexNow
        continue-on-error: true
        run: |
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"wiztrydx.com","key":"13cedb6977af8923f843dbfdf8bd69a615385400c8cb0edd","keyLocation":"https://wiztrydx.com/13cedb6977af8923f843dbfdf8bd69a615385400c8cb0edd.txt","urlList":["https://wiztrydx.com/","https://wiztrydx.com/kumamoto-ai-training/","https://wiztrydx.com/service/","https://wiztrydx.com/ai-video/","https://wiztrydx.com/works/","https://wiztrydx.com/about/","https://wiztrydx.com/blog/"]}' \
            -w "\nIndexNow HTTP %{http_code}\n"
